[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "omnimem"
version = "0.1.0"
description = "Git for AI Agent Knowledge - local-first agent memory and code intelligence"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
]

[tool.maturin]
bindings = "bin"
strip = true