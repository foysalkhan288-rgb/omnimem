[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
# PyPI distribution name. `omnimem` on PyPI is an unrelated project, so
# we publish under `omnimem-py`. The Python import namespace differs
# from the distribution name on purpose (same pattern as
# `scikit-learn` -> `sklearn`, `opencv-python` -> `cv2`): we install
# via `pip install omnimem-py` and code imports as `import pyomnimem`.
# The pure-Python package lives under `python/pyomnimem/`; the compiled
# pyo3 extension is exposed as `pyomnimem._omnimem`.
name = "omnimem-py"
# Kept in sync with [workspace.package].version in ../../Cargo.toml.
# Bump both together; the release workflow asserts they match.
version = "0.1.7"
description = "Python bindings for omnimem: Git for AI Agent Knowledge. A persistent, versioned knowledge layer for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "omnimem contributors" }]
keywords = ["knowledge-graph", "agent-memory", "retrieval", "llm", "rag", "learned-sparse", "neural-sparse", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage      = "https://github.com/Uranid/omnimem"
Repository    = "https://github.com/Uranid/omnimem"
Documentation = "https://github.com/Uranid/omnimem/blob/main/docs/QUICKSTART.md"
Benchmarks    = "https://github.com/Uranid/omnimem/blob/main/docs/benchmarks/ai-native.md"
Changelog     = "https://github.com/Uranid/omnimem/releases"

[tool.maturin]
# Mixed project: pure-Python code lives under `python/pyomnimem/` and the
# compiled Rust extension ships as the private `pyomnimem._omnimem` submodule.
# `python/pyomnimem/__init__.py` re-exports the Rust classes so
# `from pyomnimem import Repo` works.
#
# This layout lets us ship optional Python companions - `pyomnimem.langchain`,
# `pyomnimem.crewai` etc. - inside the same wheel.
python-source = "python"
module-name   = "pyomnimem._omnimem"
# abi3-py39 lets us ship a single wheel that works from 3.9 onward.
features      = ["pyo3/extension-module"]

[project.optional-dependencies]
# Each extra gates a Python companion in `python/pyomnimem/<x>.py`. The
# submodule is always present in the wheel but raises a helpful
# ImportError at import-time if the extra wasn't installed.
langchain = ["langchain-core>=0.3,<1"]
crewai    = ["crewai>=0.80,<1"]
