[package]
name = "omnimem-backend-redb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Production embedded-KV backend for omnimem - redb-backed Blockstore and OpHeadsStore."
categories = ["database"]
keywords = ["knowledge-graph", "content-addressed", "versioning", "omnimem", "redb"]
readme = "README.md"
documentation = "https://docs.rs/omnimem-backend-redb"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
omnimem-core = { workspace = true }
omnimem-ann  = { workspace = true, default-features = false }
bytes     = { workspace = true }
redb      = { workspace = true }

[dev-dependencies]
omnimem-core-testutils = { workspace = true }
ipld-core           = { workspace = true }
serde               = { workspace = true, features = ["derive"] }
# Phase-B1b (PHASE-A-2 bench plan): criterion-driven backend-comparison
# bench. `harness = false` keeps runtime zero; bench only runs on demand
# via `cargo bench -p omnimem-backend-redb`.
criterion           = { workspace = true }

[[bench]]
name    = "redb_vs_memory"
harness = false
